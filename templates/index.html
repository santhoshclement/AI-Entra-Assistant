<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Entra Assistant</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 600px;
        }

        h1 {
            color: #0078D4;
        }

        p {
            color: #555;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: #0078D4;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .btn:hover {
            background: #005A9E;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>🤖 AI Entra Assistant</h1>

    <p>
        Welcome to the AI-powered Microsoft Entra ID Assistant.
    </p>

    <p>
        Hosted on Flask + Render.
    </p>

    <a href="/health" class="btn">Health Check</a>
</div>

</body>
</html>
